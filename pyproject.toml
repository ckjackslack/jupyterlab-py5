[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab-py5"
version = "0.2.0"
description = "Run py5 (Processing for Python) sketches in JupyterLab, in Docker or locally, with a headless virtual display."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ckjackslack" }]
keywords = ["py5", "processing", "jupyterlab", "docker", "creative-coding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Jupyter :: JupyterLab",
    "Topic :: Artistic Software",
]
# py5 and py5jupyter only publish alpha releases; the explicit pre-release lower
# bounds let pip and uv pick them without enabling pre-releases globally.
dependencies = [
    "py5[jupyter]>=0.10.12a0",
    "py5jupyter>=0.2.1a0",
    "jupyterlab>=4.6.4",
    "notebook>=7.6.3",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyter-client>=8.6",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[project.optional-dependencies]
# The libraries the original image shipped for py5 work (shapely, trimesh, colour, matplotlib...).
extras = ["py5[extras]>=0.10.12a0"]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "pyyaml>=6.0.3",
    "hadolint-bin>=2.15.1",
]

[project.scripts]
jupyterlab-py5 = "jupyterlab_py5.cli:main"

[project.urls]
Source = "https://github.com/ckjackslack/jupyterlab-py5"

[tool.hatch.build.targets.wheel]
packages = ["src/jupyterlab_py5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a JDK, Xvfb and py5; executes real notebooks (skipped when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.ruff.lint.per-file-ignores]
# py5 imported mode / py5bot: setup(), size(), mouse_x ... are injected by the kernel.
"notebooks/*.ipynb" = ["F821"]

[tool.ruff.format]
quote-style = "double"
